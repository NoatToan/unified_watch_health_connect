syntax = "proto2";

import "statis_base.proto";
import "silence_mode.proto";

option java_package = "com.xiaomi.hm.health.bt.proto";

message YorkLcdEventMessage {
    //屏幕点亮次数
    required uint32 lcdOnBecauseOfPress 	= 1; //按键点亮屏幕次数
    required uint32 lcdOnBecauseOfEvent 	= 2; //抬腕点亮屏幕次数
    required uint32 lcdOnBecauseOfNotify 	= 3; //通知提醒等点亮屏幕次数
}


message YorkMenuEventMessage {
    //菜单页面 统计
    required uint32 statusPage 				= 1; //菜单-状态点击次数
    required uint32 heartPage 				= 2; //菜单-心率点击次数
    required uint32 paiPage					= 3; //菜单-PAI点击次数
    required uint32 notifyPage				= 4; //菜单-通知点击次数
    required uint32 pressurePage			= 5; //菜单-压力点击次数
    required uint32 breathePage				= 6; //菜单-呼吸点击次数
    required uint32 womenHealthPage			= 7; //菜单-女性健康点击次数
    required uint32 eventRemindPage			= 8; //菜单-事件提醒点击次数
    required uint32 weatherPage				= 9; //菜单-天气点击次数
    required uint32 sportPage				= 10;//菜单-运动点击次数
    required uint32 nfcPage					= 11;//菜单-卡包点击次数
    required uint32 morePage				= 12;//菜单-更多点击次数
    required uint32 silencePage				= 13;//菜单-勿扰点击次数
	required uint32 alarmPage				= 14;//菜单-闹钟点击次数
	required uint32 cameraPage				= 15;//菜单-拍照点击次数
	required uint32 musicPageCount			= 16;//菜单-音乐点击次数
	required uint32 countdownPage			= 17;//菜单-倒计时点击次数
	required uint32 findphonePage			= 18;//菜单-找手机点击次数
	required uint32 phonemutePage			= 19;//菜单-手机静音点击次数
	required uint32 alipayPage				= 20;//菜单-支付宝点击次数
	required uint32 worldTimePage			= 21;//菜单-世界时钟点击次数
	required uint32 calenderPage			= 22;//菜单-日历点击次数
	required uint32 dialPage				= 23;//菜单-表盘点击次数
	required uint32 settingPage				= 24;//菜单-设置点击次数
	required uint32 bloodoxygenPage 		= 25;//菜单-血氧点击次数
};


message YorkXiaoaiEventMessage {
    //小爱同学
    required uint32 xiaoaiPage 				= 1; //进入小爱同学页面次数
	required uint32 linkFail				= 2; //小爱同学连接失败次数
	required uint32 identifySuccPage		= 3; //小爱同学识别成功次数
	required uint32 unauthorized			= 4; //小爱同学显示未授权次数
	required uint32 identifyFailPage		= 5; //小爱同学识别失败次数
	required uint32 guidancePage			= 6; //小爱同学显示引导语次数
}


message YorkMoreEventMessage {
    //更多
    required uint32 alarmOpenPage 			= 1; //闹钟开启次数
	required uint32 alarmCreateByXiaoaiPage	= 2; //通过小爱同学 创建闹钟次数
	required uint32 alarmCreateByAppPage	= 3; //通过小米运动app 创建闹钟次数
	required uint32 alarmClosePage			= 4; //闹钟关闭次数
	required uint32 eventCreateByXiaoaiPage	= 5; //通过小爱同学 创建事件提醒次数
	required uint32 eventCreateByAppPage	= 6; //通过小米运动app 创建事件提醒次数
	required uint32 takePhotosPage			= 7; //使用拍照次数
	required uint32 musicControlVolumePage1	= 8; //通过小爱同学调节音量次数
	required uint32 musicControlPreNextPage1= 9; //通过小爱控制上一首下一首次数
	required uint32 musicControlPausePage1	= 10;//通过小爱暂停/播放音乐次数
	required uint32 musicControlVolumePage2	= 11;//进入音乐页面调节音量次数
	required uint32 musicControlPreNextPage2= 12;//进入音乐页面控制上一首下一首次数
	required uint32 musicControlPausePage2	= 13;//进入音乐页面点击暂停/播放音乐次数
	required uint32 muteOpenPage			= 14;//点击开启铃声次数
	required uint32 muteClosePage			= 15;//点击关闭铃声次数
	required uint32 alipayBindPage			= 16;//绑定支付宝次数
	required uint32 lookScreenOpenPage		= 17;//锁屏开启次数
	required uint32 lookScreenCloasePage	= 18;//锁屏关闭次数
	required uint32 brightPage				= 19;//亮度点击次数
	required uint32 autoCloseLcdPage		= 20;//自动息屏设置次数
	required uint32 shortcutPage			= 21;//进入快捷入口展示次数
}


message YorkSportEventMessage {
    //运动
    required uint32 beforeSportSkipGpsLoc			= 1; //运动前GPS定位中跳过次数
	required uint32 beforeSportSuccGpsLoc			= 2; //运动前等待GPS定位成功次数
	required uint32 sportingSuccGpsLocTimeLess1S	= 3; //运动GPS定位成功时长 0到1秒 次数
	required uint32 sportingSuccGpsLocTimeLess3S	= 4; //运动GPS定位成功时长 1到3秒 次数
	required uint32 sportingSuccGpsLocTimeLess5S	= 5; //运动GPS定位成功时长 3到5秒 次数
	required uint32 sportingSuccGpsLocTimeLess10S	= 6; //运动GPS定位成功时长 5到10秒 次数
	required uint32 sportingSuccGpsLocTimeLessOther	= 7; //运动GPS定位成功时长 >10秒 次数
	required uint32 sportingSuccGpsLocPage			= 8; //运动中GPS定位成功次数
	required uint32 sportingDisconPage				= 9; //运动中手机断连次数
	required uint32 sportingReconnectPage			= 10; //运动中手机恢复连接次数
}


message YorkNotifyEventMessage {
    //通知提醒
    required uint32 notifyDisplayPage		= 1; //通知列表展示次数
	required uint32 appNotifyDispalyPage	= 2; //APP通知提醒展示次数
	required uint32 callingPage				= 3; //来电提醒次数
	required uint32 longSitePage			= 4; //久坐提醒次数
	required uint32 linkDisconpage			= 5; //连接断开展示次数
	required uint32 eventRemindPage			= 6; //事件提醒展示次数
	required uint32 alarmOnLaterOnPage		= 7; //闹钟提醒-稍后提醒次数
	required uint32 alarmOnClosePage		= 8; //闹钟提醒-关闭次数
}


message YorkEditDialEventMessage {
    //可编辑表盘控件使用情况	
	required uint32 stepIdPage				= 1; //状态 快捷入口使用次数
	required uint32 hrPage					= 2; //心率 快捷入口使用次数
	required uint32 calPage					= 3; //消耗 
	required uint32 paiPage					= 4; //PAI点击次数
	required uint32 batteryPage				= 5; //电池
	required uint32 dayPaiPage				= 6; //近7天PAI
	required uint32 hourStepPage			= 7; //每小时步数
	required uint32 allDayHr				= 8;//全天心率曲线
	required uint32 weatherPage				= 9;//天气
	required uint32 sunrisePage				= 10;//日出日落
	required uint32 otherWeatehrPage		= 11;//其他天气
	required uint32 airQualityPage			= 12;//空气质量
	required uint32 EventRemindPage			= 13;//事件提醒
	required uint32 alarmPage				= 14;//闹钟
	required uint32 calendarPage			= 15;//日历
	required uint32 sportPage				= 16;//运动
}


message YorkDialEventMessage {
    //表盘
    required uint32 dialListDisplayPage		= 1; //表盘列表展示次数
	required uint32 dialEditpage			= 2; //可编辑表盘自定义次数
	
	required YorkEditDialEventMessage EditDial1	= 3;//可编辑表盘1的使用情况
	required YorkEditDialEventMessage EditDial2	= 4;//可编辑表盘2的使用情况
	required YorkEditDialEventMessage EditDial3	= 5;//可编辑表盘3的使用情况
}


message YorkShortcutEventMessage {
    //快捷入口
    required uint32 notifyDisplayPage		= 1; //快捷入口-通知展示 次数
	required uint32 xiaoaiDisplayPage		= 2; //快捷入口-小爱展示 次数
	required uint32 weatehrDisplayPage		= 3; //快捷入口-天气展示 次数
	required uint32 musicDisplayPage		= 4; //快捷入口-音乐展示 次数
	required uint32 statusDisplayPage		= 5; //快捷入口-状态展示 次数
	required uint32 paiDisplayPage			= 6; //快捷入口-PAI展示 次数
	required uint32 heartDisplayPage		= 7; //快捷入口-心率展示 次数
	required uint32 pressureDisplayPage		= 8; //快捷入口-压力展示 次数
	required uint32 breatheDisplayPage		= 9; //快捷入口-呼吸展示 次数
	required uint32 womenHealthDisplayPage	= 10;//快捷入口-女性健康展示 次数
	required uint32 eventRemindDisplayPage	= 11;//快捷入口-事件提醒展示 次数
	required uint32 sportDisplayPage		= 12;//快捷入口-运动展示 次数
	required uint32 nfcDisplayPage			= 13;//快捷入口-卡包展示 次数
	required uint32 silenceDisplayPage		= 14;//快捷入口-勿扰展示 次数
	required uint32 alarmDisplayPage		= 15;//快捷入口-闹钟展示 次数
	required uint32 cameraDisplayPage		= 16;//快捷入口-拍照展示 次数
	required uint32 stopWatchDisplayPage	= 17;//快捷入口-秒表展示 次数
	required uint32 countDownDisplayPage	= 18;//快捷入口-倒计时展示 次数
	required uint32 findPhoneDisplayPage	= 19;//快捷入口-找手机展示 次数
	required uint32 phoneMuteDisplayPage	= 20;//快捷入口-手机静音展示 次数
	required uint32 alipayBrDisplayPage		= 21;//快捷入口-支付宝条形码页面展示 次数
	required uint32 alipayQrDisplayPage		= 22;//快捷入口-支付宝二维码页面展示 次数
	required uint32 worldTimeDisplayPage	= 23;//快捷入口-世界时钟页面展示 次数
	required uint32 calendarDisplayPage		= 24;//快捷入口-日历页面展示 次数
	required uint32 bloodoxygenDisplayPage	= 25;//快捷入口-血氧页面展示 次数
}

message YorkBloodoxygenEventMessage {
    //血氧结果
    required uint32 measuresucessDisplayPage	  = 1; //血氧测量成功页面 次数
	required uint32 measurefailsignalDisplayPage  = 2; //血氧测量失败页面(信号不好) 次数
	required uint32 measurefailnowearDisplayPage  = 3; //血氧测量失败页面(未佩戴) 次数
	required uint32 measurefailagainDisplayPage	  = 4; //血氧结果页面-测量失败重新测量点击 次数
	required uint32 measuresuccagainDisplayPage	  = 5; //血氧结果页面-测量成功重新测量点击 次数
}

message YorkAlexaEventMessage {
    //Alexa
    required uint32 alexapagecounter	  = 1; //进入Alexa页面次数
	required uint32 success_request       = 2; //成功请求
	required uint32 unknow_error  		  = 3; //未知错误
	required uint32 net_error	  		  = 4; //网络错误
	required uint32 net_timeout	  		  = 5; //网络超时
	required uint32 unauthorized  		  = 6; //未授权
	required uint32 tts_time_out  		  = 7; //TTS_TIME_OUT
	required uint32 unconnect_mobile	  = 8; //未连接手机，无法使用
	required uint32 upload_data			  = 9; //手环正在上传数据，alexa暂时无法使用
	required uint32 unsupport_function	  = 10; //暂不支持该功能
	required uint32 unsupport_language    = 11; //暂不支持该语言
	required uint32 cmd_for_smarthome  	  = 12; //Smart home commands
	required uint32 cmd_for_alarms	      = 13; //Alarms and Timers
	required uint32 cmd_for_reminders	  = 14; //Named Alarms and Reminders
	required uint32 cmd_for_lists  		  = 15; //Lists
	required uint32 cmd_for_weather  	  = 16; //Weather
	required uint32 cmd_for_notifications = 17; //Notifications Indicator
	required uint32 cmd_for_search	  	  = 18; //Search 
	required uint32 cmd_for_translation   = 19; //Translation
	required uint32 cmd_for_information	  = 20; //Information
	required uint32 cmd_for_qa	  		  = 21; //Q&A - Phatic 
}

message YorkStatisticsMessage {
    required StatisBaseMessage base 			= 1; //通用统计信息
    required SilenceMode silenceMode 			= 2; //勿扰模式
    required uint32 backlightLevel 				= 3; //背光亮度
	required uint32 dialId 						= 4; //表盘使用情况统计
	
	required YorkLcdEventMessage LcdEvent			= 5; //
	
    required YorkMenuEventMessage EventByShortcut 	= 6; //快捷入口点击进入
	required YorkMenuEventMessage EventByMenu 		= 7; //菜单入口点击进入
	required YorkMenuEventMessage EventByDial 		= 8; //表盘入口点击进入
	
	required YorkXiaoaiEventMessage XiaoaiEvent 	= 9; //
	required YorkMoreEventMessage 	MoreEvent		= 10;//
	required YorkSportEventMessage 	SportEvent		= 11;//
	required YorkNotifyEventMessage NotifyEvent 	= 12;//
	required YorkDialEventMessage	DialEvent		= 13;//
	
	required YorkShortcutEventMessage ShortcutLess3S= 14;//快捷入口 展示时长 0-3S的统计
	required YorkShortcutEventMessage ShortcutLess5S= 15;//快捷入口 展示时长 3-5S的统计
	required YorkShortcutEventMessage ShortcutLess8S= 16;//快捷入口 展示时长 5-8S的统计
	required YorkShortcutEventMessage ShortcutLess10S= 17;//快捷入口 展示时长 8-10S的统计
	required YorkShortcutEventMessage ShortcutLessOther= 18;//快捷入口 展示时长 大于10S的统计
	
	required YorkBloodoxygenEventMessage BloodoxygenEvent = 19;
	required YorkAlexaEventMessage AlexaEvent = 20;
};
