com.xiaomi.ai.domain.mobileApp.lattice {
  rule = [
    {
      type: "transform",
      before: [
        {token: "听书|fm|新闻|影音|阅读|游戏", ref_slot: "eps"}
      ],
      after: [
        {token: "<any>", ref_slot: "name"}
      ],
    }
    {
      type: "transform",
      before: [
        {token: "小米|腾讯|网易|京东|百度|搜狐|新浪|微软|滴滴|阿里", ref_slot: "eps"}
        {token: "</s>", ref_slot: "eps", max_wind: 0}
      ],
      after: [
        {token: "<any>", ref_slot: "name"}
        {token: "</s>", ref_slot: "eps", max_wind: 0}
      ],
    }
    {
      type: "transform",
      before: [
        {token: "导航", ref_slot: "eps"}
      ],
      after: [
        {token: "地图", norm_token: "地图", ref_slot: "name", ref_slot_value: "地图"}
      ],
    }
    {
      type: "transform",
      before: [
        {token: "发微", ref_slot: "eps"}
        {token: "信", ref_slot: "eps", max_wind: 0}
      ],
      after: [
        {token: "发", norm_token: "发", ref_slot: "open", ref_slot_value: "发"}
        {token: "微信", norm_token: "微信", ref_slot: "name", ref_slot_value: "微信"}
      ],
    }
    {
      type: "transform",
      before: [
        {token: "微", ref_slot: "eps"}
        {token: "信关", ref_slot: "eps", max_wind: 0}
      ],
      after: [
        {token: "微信", norm_token: "微信", ref_slot: "name", ref_slot_value: "微信"}
        {token: "关", norm_token: "关", ref_slot: "close", ref_slot_value: "关"}
      ],
    }
    {
      type: "transform",
      before: [
        {token: "下", ref_slot: "eps"}
        {token: "载货", ref_slot: "eps", max_wind: 0}
      ],
      after: [
        {token: "下载", norm_token: "下载", ref_slot: "install", ref_slot_value: "下载"}
        {token: "货", norm_token: "货", ref_slot: "name", ref_slot_value: "货"}
      ],
    }
    {
      type: "transform",
      before: [
        {token: "下", ref_slot: "eps"}
        {token: "载货车", ref_slot: "eps", max_wind: 0}
      ],
      after: [
        {token: "下载", norm_token: "下载", ref_slot: "install", ref_slot_value: "下载"}
        {token: "货车", norm_token: "货车", ref_slot: "eps", ref_slot_value: "货车"}
      ],
    }
    {
      type: "transform",
      before: [
        {token: "微信", ref_slot: "name|eps"}
        {token: "qq", ref_slot: "name|eps", max_wind: 0}
      ],
      after: [
        {token: "微信", norm_token: "微信", ref_slot: "name", ref_slot_value: "微信"}
        {token: "qq", norm_token: "qq", ref_slot: "name", ref_slot_value: "qq"}
      ],
    }
  ]
}
