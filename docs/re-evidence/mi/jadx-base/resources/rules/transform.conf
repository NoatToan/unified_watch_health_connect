com.xiaomi.ai.domain.phoneCall.lattice {
  rule = [
    // 给家/家里打电话, 生成节点name:家
    {
      type: "transform",
      before: [
        {token: "<any>", ref_slot: "orientation"},
        {token: "家|家里", ref_slot: "eps", max_wind: 0},
        {token: "<any>", ref_slot: "operation"},
        {token: "<any>", ref_slot: "phone"},
      ],
      after: [
        {token: "<any>", ref_slot: "orientation"},
        {token: "家", norm_token: "家", ref_slot: "name", ref_slot_value: "家", max_wind: 0},
        {token: "<any>", ref_slot: "operation"},
        {token: "<any>", ref_slot: "phone"},
      ],
    },
    // 给家/家里打电话, 生成节点name:家
    {
      type: "transform",
      before: [
        {token: "<any>", ref_slot: "operation"},
        {token: "<any>", ref_slot: "phone"},
        {token: "<any>", ref_slot: "orientation"},
        {token: "家|家里", ref_slot: "eps", max_wind: 0},
      ],
      after: [
        {token: "<any>", ref_slot: "operation"},
        {token: "<any>", ref_slot: "phone"},
        {token: "<any>", ref_slot: "orientation"},
        {token: "家", norm_token: "家", ref_slot: "name", ref_slot_value: "家", max_wind: 0},
      ],
    },
    // 打给家/家里, 生成节点name:家
    {
      type: "transform",
      before: [
        {token: "<any>", ref_slot: "call"},
        {token: "家|家里", ref_slot: "eps", max_wind: 0},
      ],
      after: [
        {token: "<any>", ref_slot: "call"},
        {token: "家", norm_token: "家", ref_slot: "name", ref_slot_value: "家", max_wind: 0},
      ],
    },
  ]
}