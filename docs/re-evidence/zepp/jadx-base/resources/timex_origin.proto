syntax = "proto2";

import "silence_mode.proto";
import "statis_base.proto";

option java_package = "com.xiaomi.hm.health.bt.proto";

message TimexEventMessage {
    //屏幕点亮次数
    required uint32 lcdOnBecauseOfPress = 1; //按键点亮屏幕次数
    required uint32 lcdOnBecauseOfEvent = 2; //抬腕或通知提醒等点亮屏幕次数

    //首页流出统计
    required uint32 dial2DND = 3; //表盘进入勿扰次数
    required uint32 dial2Notify = 4; //表盘进入通知页面次数
    required uint32 dial2MainItem1 = 5; //表盘进入主菜单第一项次数

    //各页面展示次数
    required uint32 activityMenu = 6; //状态主页
    required uint32 activityHR = 7; //状态心率
    required uint32 sportPage = 8; //运动页面
    required uint32 coachPage = 9; //coach页面
    required uint32 sportSettingPage = 10; //运动设置页面
    required uint32 weatherPage = 11; //天气页面
    required uint32 alarmPage = 12; 	//闹钟点击次数
    required uint32 alarmOnPage = 13; //闹钟开启页面
    required uint32 alarmOffPage = 14; //闹钟关闭页面
    required uint32 musicPage = 15; //音乐页面
    required uint32 settingPage = 16; //设置页面
    required uint32 settingWatchfacePage = 17; //设置表盘页面
    required uint32 settingLongpressPage = 18; //设置长按按键功能页面
    required uint32 settingBacklightPage = 19; //设置背光亮度页面

    //运动统计
    required uint32 waitGpsLocationNum = 20; //等待gps定位成功次数
    required uint32 skipGpsLocationNum = 21; //跳过gps定位次数
    required uint32 sportGpsFindNum = 22; //运动中GPS定位成功次数
    required uint32 sportGPSLocationWaitTime = 23;  //运动GPS定位成功时长 单位毫秒
    required uint32 sportLinkLostNum = 24;         //运动中手机断连次数
    required uint32 sportSettingAutoLapNum = 25; //自动圈数开启次数
    required uint32 sportSettingAutoPauseNum = 26; //自动暂停开启次数
    required uint32 sportReconnectNum = 27; //运动中手机恢复连接次数

    //功能使用统计
    required uint32 compassPage = 28; //指南针页面
    required uint32 stopwatchNum = 29; //秒表点击次数
    required uint32 countdownNum = 30; //倒计时点击次数
    required uint32 appNotifRemindDisCount = 31;//APP通知提醒展示次数
    required uint32 callingRemindDisCount = 32; //来电提醒次数
    required uint32 longSitRemindDisCount = 33;//久坐提醒次数
    required uint32 disconnectDisCount = 34;  //连接断开展示次数
    required uint32 alarmReminderLaterOn = 35;  //闹钟提醒-稍后提醒次数
    required uint32 alarmReminderClose = 36;  //闹钟提醒-关闭次数
    required uint32 findPhoneSucc = 37;         //查找手机成功次数
    required uint32 findPhoneFail = 38;         //查找手机失败次数
    required uint32 setPowerOffCount = 39;      //设置-关机次数
    required uint32 factoryResetPage = 40;      //设置-恢复出厂点击次数

    optional uint32 alipayQRCodeNum = 41 [default = 0]; //使用支付宝二维码次数
    optional uint32 alipayCode128Num = 42 [default = 0]; //使用支付宝条形码次数

    optional uint32 dialId = 43 [default = 0]; //表盘ID
};

message TimexStatisticsMessage {
    required StatisBaseMessage base = 1; //通用统计信息
    required SilenceMode silenceMode = 2; //勿扰模式
    required uint32 backlightLevel = 3; //背光亮度

    optional TimexEventMessage event = 4; //打点事件
};
