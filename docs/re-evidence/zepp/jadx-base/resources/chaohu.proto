syntax = "proto2";

import "silence_mode.proto";
import "statis_base.proto";

option java_package = "com.xiaomi.hm.health.bt.proto";

message ChaoHuEventMessage {
    //屏幕点亮次数
    required uint32 lcdOnBecauseOfPress = 1; 	//按键点亮屏幕次数
    required uint32 lcdOnBecauseOfEvent = 2; 	//抬腕或通知提醒等点亮屏幕次数

    //首页流出统计
    required uint32 dial2DND = 3; 				//表盘进入勿扰次数-勿扰设置页展示次数
    required uint32 dial2Notify = 4; 			//表盘进入通知页面次数-通知列表页展示次数
    required uint32 dial2MainItem1 = 5; 		//表盘进入主菜单第一项次数

    //各页面展示次数
    required uint32 statusPage1 = 6; 			//状态第一页
    required uint32 statusPage2 = 7; 			//状态第二页
    required uint32 sportPage = 8; 				//运动页面
    required uint32 sportHistoryPage = 9; 		//运动历史页面-运动-历史点击次数
    required uint32 sportSettingPage = 10; 		//运动设置页面
    required uint32 weatherPage = 11; 			//天气页面-天气-实时天气展示次数
    required uint32 alarmPage = 12; 			//闹钟页面-闹钟点击次数
    required uint32 timerPage = 13; 			//计时器页面
    required uint32 timerStopwatchPage = 14; 	//秒表页面
    required uint32 timerCountdownPage = 15; 	//倒计时页面
    required uint32 compassPage = 16; 			//指南针页面
    required uint32 settingPage = 17; 			//设置页面-设置列表页展示次数
    required uint32 settingWatchfacePage = 18; 	//设置表盘页面-设置-表盘列表页展示次数
    required uint32 settingLongpressPage = 19; 	//设置长按按键功能页面
    required uint32 settingBacklightPage = 20; 	//设置背光亮度页面-设置-亮度设置项

    //运动统计
    required uint32 waitGpsLocationNum = 21; 	//等待gps定位成功次数-运动前等待GPS定位成功次数
    required uint32 skipGpsLocationNum = 22; 	//跳过gps定位次数-运动前GPS定位中跳过次数
    required uint32 sportPage1Num = 23; 		//运动第一页展示次数
    required uint32 sportPage2Num = 24; 		//运动第二页展示次数
    required uint32 sportPage3Num = 25; 		//运动第三页展示次数

    //功能使用统计
    required uint32 stopwatchNum = 26; 			//使用秒表次数-计时器-秒表点击次数
    required uint32 countdownNum = 27; 			//使用倒计时次数-计时器-倒计时点击次数
    required uint32 compassNum = 28; 			//使用指南针次数
    optional uint32 alipayQRCodeNum = 29 [default = 0]; //使用支付宝二维码次数
    optional uint32 alipayCode128Num = 30 [default = 0]; //使用支付宝条形码次数

    optional uint32 dialId = 31 [default = 0]; //表盘ID

};


message ChaoHuAddEventMessage {
    required uint32 statusPage = 1;            //状态点击次数
    required uint32 negativePage = 2;          //进入负屏展示次数
    required uint32 alarmOpenTimes = 3;        //闹钟列表页-开启次数
    required uint32 alarmCloseTimes = 4;       //闹钟列表页-关闭次数
    required uint32 findPhonePage = 5;         //设置-查找手机使用次数
    required uint32 findPhoneSucc = 6;         //查找手机成功次数
    required uint32 findPhoneFail = 7;         //查找手机失败次数
    required uint32 setPowerOffCount = 8;      //设置-关机次数
    required uint32 factoryResetPage = 9;      //设置-恢复出厂点击次数
    required uint32 reminderPage = 10;          //事件提醒展示次数
    required uint32 alarmReminderLaterOn = 11;  //闹钟提醒-稍后提醒次数
    required uint32 alarmReminderClose = 12;    //闹钟提醒-关闭次数
    required uint32 sportLinkLost = 13;         //运动中手机断连次数
    required uint32 sportLinkRecover = 14;      //运动中手机恢复连接次数
    required uint32 sportGPSLocationMinTime = 15;  //运动GPS定位成功最短时长 单位毫秒
    required uint32 sportGPSLocationMaxTime = 16;  //运动GPS定位成功最长时长 单位毫秒
    required uint32 sportLocationSucccTime = 17;//运动中GPS定位成功次数
    required uint32 alipayQRCodeTimes = 18;     //支付宝-二维码展示大于3秒次数
    required uint32 alipayCode128Times = 19;    //支付宝-条形码展示大于3秒次数
    required uint32 appNotifRemindDisCount = 20;//APP通知提醒展示次数
    required uint32 callingRemindDisCount =21; //来电提醒次数
    required uint32 longSitRemindDisCount = 22;//久坐提醒次数
    required uint32 disconnectDisCount = 23;    //连接断开展示次数
};

message ChaoHuStatisticsMessage {
    required StatisBaseMessage base = 1; //通用统计信息
    required SilenceMode silenceMode = 2; //勿扰模式
    required uint32 backlightLevel = 3; //背光亮度

    optional ChaoHuEventMessage event = 4; //打点事件
    optional ChaoHuAddEventMessage addEvent = 5; //新加打点事件
};

